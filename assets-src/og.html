<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of public/og.png (1200×630). Rebuild with: npm run og -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#060a18;font-family:Archivo,sans-serif}
  .card{position:absolute;inset:28px;border-radius:28px;background:#1f3fd6;color:#f2f5ff;padding:64px 64px 56px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:20px}
  .top img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#f2f2f2}
  .name{font-size:30px;font-weight:800;font-variation-settings:'wdth' 118;letter-spacing:-.01em}
  .where{font-size:20px;opacity:.9;margin-top:4px}
  h1{margin:auto 0 0;font-size:66px;line-height:.95;font-weight:800;font-variation-settings:'wdth' 125;letter-spacing:-.035em}
  .foot{margin-top:34px;font-size:22px;opacity:.92}
</style></head>
<body><div class="card">
  <div class="top"><img src="../public/img/branko.jpg" alt=""><div><div class="name">Branko Ottavianelli</div><div class="where">Remote from Argentina · UTC−3</div></div></div>
  <h1>Senior full-stack &amp; mobile<br>engineer, AI-native.</h1>
  <div class="foot">React Native · Next.js · NestJS · Agent harnesses</div>
</div></body></html>
